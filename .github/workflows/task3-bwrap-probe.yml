name: Task 3 runner probe

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: nexaflow-default
    steps:
      - name: probe runner capabilities
        run: |
          set +e
          echo "== identity"; id; uname -r
          echo "== proc status"; grep -E 'Seccomp|CapEff|CapBnd|NoNewPrivs' /proc/self/status
          echo "== apparmor userns"; cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1
          echo "== userns/mountns options"; findmnt -no FSTYPE,OPTIONS /proc /sys /dev /tmp 2>&1
          echo "== docker"; command -v docker; ls -l /var/run/docker.sock 2>&1; timeout 20 docker info --format '{{.ServerVersion}}' 2>&1; echo "docker rc=$?"
          echo "== bwrap"; command -v bwrap; bwrap --version 2>&1
          echo "== unshare -Urmpf --mount-proc"; unshare -Urmpf --mount-proc true 2>&1; echo "rc=$?"
          echo "== unshare -Urm mount tmpfs"; unshare -Urm sh -c 'mkdir -p /tmp/mp && mount -t tmpfs tmpfs /tmp/mp && echo TMPFS_OK'; echo "rc=$?"
          echo "== mount proc from userns"; unshare -Urmpf sh -c 'mount -t proc proc /proc && echo PROC_OK'; echo "rc=$?"
