name: setup-rclone
description: Install rclone into the runner temp directory and add it to PATH

inputs:
  version:
    description: rclone version to install
    required: false
    default: 1.60.1
  checksum:
    description: |
      SHA-256 checksum of rclone-v<version>-linux-amd64.zip.
      When overriding version, callers must pass the matching checksum.
    required: false
    default: fd6bc19cc7fadb13538cc109128bf92ef47762a83a3eaf2ab699b03bb2a1fe32

runs:
  using: composite
  steps:
    - name: Ensure wget
      shell: bash
      run: |
        command -v wget || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends wget; }

    - name: Download and verify rclone
      uses: nexaflow-internal/actions/wgetsum@v0
      with:
        url: https://downloads.rclone.org/v${{ inputs.version }}/rclone-v${{ inputs.version }}-linux-amd64.zip
        checksum: ${{ inputs.checksum }}
        output: ${{ runner.temp }}/rclone.zip
        wget-flags: "-c --tries=3 --timeout=30"

    - name: Install rclone
      shell: bash
      run: |
        unzip -o -j "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-bin"
        chmod +x "$RUNNER_TEMP/rclone-bin/rclone"
        echo "$RUNNER_TEMP/rclone-bin" >> "$GITHUB_PATH"
