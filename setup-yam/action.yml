name: setup-yam
description: Install chainguard-dev/yam into the runner temp directory and add it to PATH

inputs:
  version:
    description: yam version to install
    required: false
    default: v0.2.69

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache: false

    - name: Install yam
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gobin"
        GOBIN="$RUNNER_TEMP/gobin" go install github.com/chainguard-dev/yam@${{ inputs.version }}
        echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
