name: setup-bubblewrap
description: Install bubblewrap and verify user-namespace support

runs:
  using: composite
  steps:
    - name: Install bubblewrap
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3

    - name: Verify bubblewrap
      shell: bash
      run: |
        bwrap --version
        if ! bwrap --unshare-user --bind / / true; then
          echo "bubblewrap user-namespace check failed"
          exit 1
        fi
