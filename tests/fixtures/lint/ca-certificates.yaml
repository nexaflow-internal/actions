package:
  name: ca-certificates
  version: "20261020"
  epoch: 3
  description: "CA certificates from the Mozilla trusted root program"
  copyright:
    - license: MPL-2.0 AND MIT
  dependencies:
    runtime:
      # shim for the frozen base: bootstrap mara-base depends on bare
      # "ca-certificates"; our split moved the bundle file to
      # ca-certificates-bundle, so main must pull it along (upstream needs
      # no such shim because its base depends on the bundle name directly)
      - ca-certificates-bundle
  resources:
    cpu: "2"
    memory: 4Gi
vars:
  # Subject names of the emSign roots removed in NSS 3.131.1 (upstream
  # 20261020), checked by the tests in addition to the hashes.
  excluded-names: |
    emSign ECC Root CA - G3
    emSign Root CA - C1
    emSign ECC Root CA - C3
  # SHA-256 hashes of the public keys of the same roots.
  excluded-spki-hashes: 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782|b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc|eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - openssl
      - p11-kit-trust
      - perl
pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.alpinelinux.org/alpine/ca-certificates
      tag: ${{package.version}}
      expected-commit: 2058424fda70ee478bcce872dcf141a0c5499ee0
  - runs: |
      make CC="${{host.triplet.gnu}}-gcc"
  - runs: |
      make install DESTDIR="${{targets.destdir}}"

      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin/
      rmdir ${{targets.destdir}}/usr/sbin

      (
        echo "# Automatically generated by ${{package.name}}-${{package.version}}-r${{package.epoch}}"
        echo "# Do not edit."
        cd "${{targets.destdir}}"/usr/share/ca-certificates || exit
        find . -name '*.crt' | sort | cut -b3-
      ) > "${{targets.destdir}}"/etc/ca-certificates.conf

      find . -maxdepth 1 -name '*.crt' | sort | while read -r i; do
        cat "$i"
        printf "\n"
      done > "${{targets.destdir}}"/etc/ssl/certs/ca-certificates.crt

      mkdir -p "${{targets.destdir}}"/etc/apk/protected_paths.d
      cat > "${{targets.destdir}}"/etc/apk/protected_paths.d/ca-certificates.list <<-EOF
        -etc/ssl/certs/ca-certificates.crt
        -etc/ssl/certs/ca-cert-*.pem
        -etc/ssl/certs/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].[r0-9]*
      EOF

      cat > "${{targets.destdir}}"/etc/ca-certificates/update.d/certhash <<-EOF
      #!/bin/sh
      exec /usr/bin/c_rehash /etc/ssl/certs
      EOF

      chmod +x "${{targets.destdir}}"/etc/ca-certificates/update.d/certhash
  - runs: |
      # K1-infra: upstream tests leave root-owned 0600 files in the shared
      # workspace; the unprivileged host xattr scan needs them readable.
      chmod -R a+rX .
subpackages:
  - name: "ca-certificates-bundle"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/ssl/certs
          mv "${{targets.destdir}}"/etc/ssl/certs/ca-certificates.crt "${{targets.subpkgdir}}"/etc/ssl/certs
          ln -s certs/ca-certificates.crt "${{targets.subpkgdir}}"/etc/ssl/cert.pem
          # Provide Fedora compatible location for the bundle (fixes compat with Dart lang)
          mkdir -p ${{targets.subpkgdir}}/etc/pki/tls/certs/
          ln -s ../../../ssl/certs/ca-certificates.crt ${{targets.subpkgdir}}/etc/pki/tls/certs/ca-bundle.crt
          # Provide RHEL compatible location for the bundle (fixes compat with fluent-bit)
          mkdir -p ${{targets.subpkgdir}}/etc/ssl/certs/
          ln -s ca-certificates.crt ${{targets.subpkgdir}}/etc/ssl/certs/ca-bundle.crt
    test:
      environment:
        contents:
          packages:
            - ca-certificates-bundle
      pipeline:
        - name: test for certs directory
          runs: |
            if [ -d "/etc/ssl/certs" ]; then
              echo "certs directory exists"
            else
              echo "certs directory does not exist"
              exit 1
            fi
        - name: test for cert.pem file
          runs: |
            if [ -s "/etc/ssl/cert.pem" ]; then
              echo "file exists and contains contents."
            else
              echo "cert.pem file does not exist or is empty"
              exit 1
            fi
        - name: test for ca-bundle.crt file
          runs: |
            if [ -s "/etc/pki/tls/certs/ca-bundle.crt" ]; then
              echo "file exists and contains contents."
            else
              echo "ca-bundle.crt file does not exist or is empty"
              exit 1
            fi
  - name: java-cacerts
    description: default certificate authorities for Java
    dependencies:
      runtime:
        - ca-certificates
        - p11-kit-trust
    pipeline:
      - runs: |
          # Install just built certs as builder's system one
          cp ${{targets.outdir}}/ca-certificates-bundle/etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt

          # Extract them for cacerts
          EPOCH=$SOURCE_DATE_EPOCH
          unset SOURCE_DATE_EPOCH
          mkdir -p "${{targets.contextdir}}"/etc/ssl/certs/java
          trust extract --overwrite --format=java-cacerts --filter=ca-anchors \
          --purpose server-auth "${{targets.contextdir}}"/etc/ssl/certs/java/cacerts
          touch -d @"$EPOCH" "${{targets.contextdir}}"/etc/ssl/certs/java/cacerts

          # Generate update script
          mkdir -p "${{targets.contextdir}}"/etc/ca-certificates/update.d
          printf '%s\n' '#!/bin/sh' 'exec trust extract --overwrite --format=java-cacerts --filter=ca-anchors --purpose server-auth /etc/ssl/certs/java/cacerts' > "${{targets.contextdir}}"/etc/ca-certificates/update.d/java-cacerts
          chmod +x "${{targets.contextdir}}"/etc/ca-certificates/update.d/java-cacerts
    test:
      environment:
        contents:
          packages:
            - default-jvm
            - openssl
      pipeline:
        # Full upstream pair restored with the wave-3 re-air (openjdk-25
        # ships default-jvm/keytool; closes the K2 row in deviations).
        # K1 (docs/deviations.md + bootstrap feedback §1.9): our openssl
        # ships no default /etc/ssl/openssl.cnf, so pass a minimal config
        # explicitly (wolfi guests get the default file). The config must
        # also carry the v3 extensions the upstream default openssl.cnf adds
        # for -x509: without basicConstraints CA:TRUE the test cert is not a
        # trust anchor, p11-kit --filter=ca-anchors drops it, and the
        # keytool half below cannot see someteststring.
        - runs: |
            test -x /etc/ca-certificates/update.d/java-cacerts
            /etc/ca-certificates/update.d/java-cacerts
            openssl pkey -pubin -in /etc/ssl/certs/java/cacerts -pubout
            openssl pkey -pubin -in /etc/ssl/certs/java/cacerts -pubout | grep -q "^-----BEGIN PUBLIC KEY-----$"
            openssl pkey -pubin -in /etc/ssl/certs/java/cacerts -pubout | grep -q "^-----END PUBLIC KEY-----$"
            cat > req.cnf <<'CNF'
            [req]
            distinguished_name = req_dn
            x509_extensions = v3_ca
            [req_dn]
            [v3_ca]
            basicConstraints = critical,CA:TRUE
            keyUsage = critical,keyCertSign,cRLSign
            CNF
            openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 -keyout server.key -out /usr/local/share/ca-certificates/server.crt -subj "/CN=someteststring/" -config req.cnf
            update-ca-certificates
            keytool -v -list -cacerts -storepass changeit | grep someteststring
        - name: Export the Java keystore as PEM
          runs: |
            keytool -list -rfc -keystore /etc/ssl/certs/java/cacerts -storepass changeit > /tmp/java-cacerts.pem
        - uses: test/excluded-certificates
          with:
            files: /tmp/java-cacerts.pem
            excluded-spki-hashes: ${{vars.excluded-spki-hashes}}
            excluded-names: ${{vars.excluded-names}}
  - name: ca-certificates-doc
    description: ca-certificates documentation
    options:
      no-depends: true
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs
test:
  environment:
    contents:
      packages:
        - curl
        # main-package test guest does not auto-carry our own -bundle
        # subpackage; the TLS checks below read its bundle file
        - ca-certificates-bundle
  pipeline:
    - runs: |
        # Test no cert
        ! SSL_CERT_FILE=/dev/null curl --ipv4 -v https://packages.wolfi.dev/os/APKINDEX.tar.gz
        # Test Debian-like compat path
        SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt curl --ipv4 -v https://packages.wolfi.dev/os/APKINDEX.tar.gz
        # Test Fedora-like compat path
        SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt curl --ipv4 -v https://packages.wolfi.dev/os/APKINDEX.tar.gz
        # Test Rhel-like compat path
        SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.crt curl --ipv4 -v https://packages.wolfi.dev/os/APKINDEX.tar.gz
        c_rehash -v
        update-ca-certificates --version
        update-ca-certificates --help
    - uses: test/tw/no-docs
update:
  enabled: true
  release-monitor:
    identifier: 332224
