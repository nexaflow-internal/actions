name: setup-go
description: Install Go and configure GOBIN under the runner temp directory

inputs:
  go-version:
    description: Go version to install
    required: false
    default: '1.24'

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Configure GOBIN
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gobin"
        echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
        go env -w GOBIN="$RUNNER_TEMP/gobin"
